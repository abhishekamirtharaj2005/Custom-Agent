# Hermclaw configuration
# Full reference: docs/CONFIG_REFERENCE.md
# Default: Ollama (local) with no guardrails and self-learning enabled.

agent:
  name: "hermclaw"
  default_profile: "default"
  language: "en"                     # en, es, de, fr, ja, ko, zh, pt, ru, hi, tr, it, uk, af, ga, hu
  list: []                           # multi-identity entries (optional)

body:
  gateway:
    bind: "loopback"                 # loopback | all
    host: "127.0.0.1"
    port: 18789
    auth:
      mode: "token"
      token_env: "HERMCLAW_GATEWAY_TOKEN"

  channels:
    telegram:
      enabled: false
      bot_token_env: "TELEGRAM_BOT_TOKEN"
      mode: "polling"                # polling | webhook
    discord:
      enabled: false
      bot_token_env: "DISCORD_BOT_TOKEN"
    slack:
      enabled: false
      bot_token_env: "SLACK_BOT_TOKEN"
      app_token_env: "SLACK_APP_TOKEN"
      socket_mode: true
    cli:
      enabled: true
    web:
      enabled: false
    whatsapp:
      enabled: false                 # backed by the Node/Baileys sidecar

  scheduler:
    heartbeat:
      enabled: true
      every: "30m"
      show_ok: false
      show_alerts: true
    jobs: []                         # - cron: "0 9 * * *"
                                      #   prompt: "Summarize overnight activity"

brain:
  model:
    # DEFAULT: Ollama (local, no API key needed)
    # Make sure Ollama is running: ollama serve
    # Pull a model first: ollama pull gemma4:12b
    provider: "openai_compat"
    model_name: "gemma4:12b"
    api_key_env: null                # Ollama doesn't need an API key
    api_base_env: null               # defaults to http://localhost:11434/v1
    context_window: 128000
    fallbacks: []                    # - provider: "openai_compat"
                                      #   model_name: "llama-3.1-70b"
                                      #   api_key_env: "OPENAI_COMPAT_API_KEY"
                                      #   api_base_env: "OPENAI_COMPAT_API_BASE"
  memory:
    compression_threshold: 0.5       # fraction of context window that triggers compression
    keep_recent_exchanges: 2
    memory_char_limit: 2200
    user_char_limit: 1375
  reflection:
    enabled: true                    # self-learning: distill memory + skills from sessions
    trigger_every_n_turns: 20

skills:
  directory: "~/.hermclaw/profiles/default/skills"
  extra_directories: []              # shared/team skill folders, read-only
  evolution_enabled: true            # Tier 2 skill-evolution loop (self-learning)
  mcp_servers: []                    # - name: "example"
                                      #   transport: "stdio"
                                      #   command: "npx some-mcp-server"

tools:
  shell_enabled: true                # NO GUARDRAILS: full system access
  approvals:
    mode: "off"                      # manual | smart | off  (off = no guardrails)
  backend: "local"                   # local | docker | ssh | singularity | modal | daytona
  docker_image: "python:3.11-slim"
  docker_network: "none"
  ssh_host: null
  ssh_user: null
  ssh_identity_file: null
  network_enabled: true
  filesystem_scope: "full"           # "full" = unrestricted access to entire filesystem

profiles: {}                         # per-profile config overrides, keyed by profile name

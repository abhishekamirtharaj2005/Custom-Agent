[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermclaw"
version = "0.1.0"
description = "A unified, self-improving personal AI agent with 28 tools, no guardrails, and self-learning capabilities. Merges OpenClaw's gateway with Hermes Agent's reasoning brain."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hermclaw contributors" }]
keywords = ["agent", "ai", "assistant", "llm", "personal-agent", "self-learning", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core dependencies: enough for `hermclaw doctor --init && hermclaw chat`
dependencies = [
    "pydantic>=2.0,<3",
    "ruamel.yaml>=0.18",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "apscheduler>=3.10,<4",
    "structlog>=24.0",
    "httpx>=0.27",
    "ddgs>=9.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Model providers
anthropic = ["anthropic>=0.30"]
bedrock = ["boto3>=1.34"]
openai = ["openai>=1.30"]

# Messaging channels
telegram = ["python-telegram-bot>=21.0"]
discord = ["discord.py>=2.3"]
slack = ["slack_sdk>=3.27", "slack_bolt>=1.18"]

# Feature extras
browser = ["playwright>=1.40"]
voice = ["edge-tts>=6.1"]
pdf = ["PyMuPDF>=1.24"]
mcp = ["mcp>=1.0"]

# Convenience bundles
channels = ["hermclaw[telegram,discord,slack]"]
all = [
    "hermclaw[anthropic,openai,channels,bedrock,browser,voice,pdf,mcp]",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/abhishekamirtharaj2005/Custom-Agent"
Documentation = "https://github.com/abhishekamirtharaj2005/Custom-Agent/blob/main/README.md"
Issues = "https://github.com/abhishekamirtharaj2005/Custom-Agent/issues"

[project.scripts]
hermclaw = "hermclaw.cli:main_entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["hermclaw"]

[tool.hatch.build.targets.wheel.force-include]
"hermclaw/body/channels/whatsapp_sidecar/package.json" = "hermclaw/body/channels/whatsapp_sidecar/package.json"
"hermclaw/body/channels/whatsapp_sidecar/index.js" = "hermclaw/body/channels/whatsapp_sidecar/index.js"
"hermclaw/brain/memory/schema.sql" = "hermclaw/brain/memory/schema.sql"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "live: hits a real network service; excluded from the default run",
]

[tool.ruff]
target-version = "py311"
line-length = 120
